name: Main CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
            S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
            S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
            S3_REGION: ${{ vars.S3_REGION }}
            NODE_ENV: ${{ vars.NODE_ENV }}
            PORT: ${{ vars.PORT }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npm --workspace client exec playwright install --with-deps chromium

            - name: Run client lint
              run: npm --workspace client run lint

            - name: Run client tests
              run: npm --workspace client run test -- --run

            - name: Typecheck client
              run: npm --workspace client run typecheck

            - name: Build client
              run: npm --workspace client run build

            - name: Generate Prisma client
              run: npm --workspace server run generate

            - name: Run database migrations
              run: npm --workspace server exec prisma migrate deploy

            - name: Run server lint
              run: npm --workspace server run lint

            - name: Run server unit tests
              run: npm --workspace server test -- --run "Tests/Unit Test"

            - name: Run server integration tests
              run: npm --workspace server run test -- --run "Tests/Integration"

            - name: Start server
              run: npm --workspace server run dev &
              
            - name: Wait for server
              run: |
                until curl --silent --fail http://localhost:3000/health; do
                  echo "Waiting for server..."
                  sleep 1
                done

            - name: Run E2E tests
              run: npm --workspace client run test:e2e